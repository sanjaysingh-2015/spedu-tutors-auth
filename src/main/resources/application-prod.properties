# ========== DATASOURCE ==========
spring.datasource.url=jdbc:mysql://localhost:3306/spEduTutors?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=RosesAreRed@c1312
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ========== JPA / HIBERNATE ==========
spring.jpa.properties.hibernate.format_sql=true

# ========== DEFAULT SECURITY USER (if enabled) ==========
spring.security.user.name=admin
spring.security.user.password=secret123

# ========== JACKSON ==========
spring.jackson.serialization.indent_output=true

# ========== CUSTOM JWT PROPERTIES ==========
security.jwt.secret=RosesAreRed@c1312ForSpEduTutorsAdmin
security.jwt.expiration=3600000
security.jwt.refresh-token-expiration=604800000

# ========== LOGGING ==========
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.com.yourcompany.authservice=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ========== ACTUATOR ==========
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# ========== CORS ==========
cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*

# ========= SWAGGER =========
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.path=/v3/api-docs